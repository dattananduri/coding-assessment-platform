server:
  port: ${PORT:8080}

spring:
  application:
    name: coding-assessment-backend
  datasource:
    url: jdbc:h2:file:./data/assessmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:Admin@TechExam2026!#}
    email: ${APP_ADMIN_EMAIL:admin@assessment.com}
  storage:
    audio-dir: ./data/recordings
  sandbox:
    timeout-ms: 3000
    memory-limit-mb: 128
